[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "editorial-qa-evals"
version = "0.1.0"
description = "Editorial QA judge agreement evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2,<3",
  "typer",
  "pyyaml",
  "scikit-learn",
  "numpy",
  "httpx",
  "python-dotenv",
  "jsonschema",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
